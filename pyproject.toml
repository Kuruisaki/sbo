[build-system]
requires = ["setuptools>=75.1.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sbo-xfoil"
version = "0.1.0"
description = "Serial surrogate-based NACA airfoil optimization with XFOIL"
requires-python = ">=3.11,<3.12"
dependencies = [
  "numpy==1.26.4", "scipy==1.14.1", "scikit-learn==1.5.2", "pandas==2.2.3",
  "matplotlib==3.9.2", "PyYAML==6.0.2", "joblib==1.4.2", "psutil==6.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["integration: launches the real configured XFOIL executable"]
